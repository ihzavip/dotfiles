[colors]
bg      = #282828
bg-alt  = #3c3836
fg      = #ebdbb2
dim     = #928374
yellow  = #fabd2f
green   = #b8bb26
red     = #fb4934
blue    = #83a598
orange  = #fe8019

[bar/main]
monitor = eDP-1
width = 100%
height = 24
radius = 0
fixed-center = true
enable-ipc = true

background = ${colors.bg}
foreground = ${colors.fg}

line-size = 2

padding-left = 1
padding-right = 2
module-margin = 1

font-0 = JetBrainsMono Nerd Font:size=8;2
font-1 = JetBrains Mono:size=8;2

modules-left   = i3
modules-center = mpris date
modules-right  = brightness pulseaudio wlp3s0 memory cpu battery

tray-position = right
tray-padding  = 4
cursor-click  = pointer

; ─── Workspaces ──────────────────────────────────────────────────────────────

[module/i3]
type = internal/i3
index-sort = true
wrapping-scroll = false
format = <label-state>

label-focused            = %index%
label-focused-padding    = 2
label-focused-foreground = ${colors.yellow}
label-focused-underline  = ${colors.yellow}
label-focused-background = ${colors.bg-alt}

label-unfocused            = %index%
label-unfocused-padding    = 2
label-unfocused-foreground = ${colors.dim}

label-urgent            = %index%
label-urgent-padding    = 2
label-urgent-foreground = ${colors.red}

label-visible            = %index%
label-visible-padding    = 2

; ─── Media ───────────────────────────────────────────────────────────────────

[module/mpris]
type = custom/script
exec = playerctl metadata --format '{{ status }}|{{ artist }}|{{ title }}' 2>/dev/null | awk -F'|' '{ if ($1=="Playing") printf "󰎆 " $2 " - " $3; else if ($1=="Paused") printf "󰏤 " $2 " - " $3 }'
interval = 2
label-maxlen = 40

; ─── Clock ───────────────────────────────────────────────────────────────────

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
label = %date%  %time%
label-foreground = ${colors.yellow}

; ─── CPU ─────────────────────────────────────────────────────────────────────

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.orange}
label = %percentage%%

; ─── Memory ──────────────────────────────────────────────────────────────────

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.blue}
label = %percentage_used%%

; ─── Network ─────────────────────────────────────────────────────────────────

[module/wlp3s0]
type = internal/network
interface = wlp3s0
interval = 3

format-connected            = <label-connected>
format-connected-prefix     = "󰤨 "
format-connected-prefix-foreground = ${colors.green}
label-connected             = %essid%

format-disconnected            = <label-disconnected>
format-disconnected-prefix     = "󰤭 "
format-disconnected-prefix-foreground = ${colors.dim}
label-disconnected             = offline
label-disconnected-foreground  = ${colors.dim}

; ─── Battery ─────────────────────────────────────────────────────────────────

[module/battery]
type = custom/script
exec = ~/.config/polybar/battery.sh
interval = 5
label-foreground = ${colors.green}

; ─── Brightness ──────────────────────────────────────────────────────────────

[module/brightness]
type = internal/backlight
card = intel_backlight
enable-scroll = true

format = <ramp> <label>
label = %percentage%%

ramp-0            = 󰃞
ramp-1            = 󰃟
ramp-2            = 󰃠
ramp-foreground   = ${colors.yellow}

; ─── Volume ──────────────────────────────────────────────────────────────────

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume  = %percentage%%

label-muted             = 󰝟 muted
label-muted-foreground  = ${colors.dim}

ramp-volume-0           = 󰕿
ramp-volume-1           = 󰖀
ramp-volume-2           = 󰕾
ramp-volume-foreground  = ${colors.blue}
