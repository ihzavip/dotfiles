format = """
[  ](bg:#fabd2f fg:#282828)\
[](bg:#d79921 fg:#fabd2f)\
$directory\
[](fg:#d79921 bg:#504945)\
$git_branch\
$git_status\
[](fg:#504945 bg:#3c3836)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#3c3836 bg:#282828)\
$time\
[ ](fg:#282828)\
\n$character"""

[directory]
style = "fg:#282828 bg:#d79921"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "Documents"
"Downloads" = "Downloads"
"Music" = "Music"
"Pictures" = "Pictures"

[git_branch]
symbol = ""
style = "bg:#504945"
format = '[[ $symbol $branch ](fg:#fabd2f bg:#504945)]($style)'

[git_status]
style = "bg:#504945"
format = '[[($all_status$ahead_behind )](fg:#fb4934 bg:#504945)]($style)'

[nodejs]
symbol = ""
style = "bg:#3c3836"
format = '[[ $symbol ($version) ](fg:#b8bb26 bg:#3c3836)]($style)'

[rust]
symbol = ""
style = "bg:#3c3836"
format = '[[ $symbol ($version) ](fg:#fe8019 bg:#3c3836)]($style)'

[golang]
symbol = ""
style = "bg:#3c3836"
format = '[[ $symbol ($version) ](fg:#83a598 bg:#3c3836)]($style)'

[php]
symbol = ""
style = "bg:#3c3836"
format = '[[ $symbol ($version) ](fg:#d3869b bg:#3c3836)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#282828"
format = '[[  $time ](fg:#a89984 bg:#282828)]($style)'
