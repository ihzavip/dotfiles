[manager]
cwd = { fg = "#83a598" }

hovered         = { fg = "#282828", bg = "#fabd2f" }
preview_hovered = { underline = true }

[filetype]
rules = [
  { url = "*.c",    fg = "#fb4934" },
  { url = "*.h",    fg = "#fabd2f" },
  { url = "*.lua",  fg = "#83a598" },
  { url = "*.md",   fg = "#b8bb26" },
  { url = "*.toml", fg = "#d3869b" },
  { url = "*.yml",  fg = "#d3869b" },
  { url = "*.sh",   fg = "#8ec07c" },
]

[status]
separator_open  = ""
separator_close = ""

[select]
border   = { fg = "#fabd2f" }
active   = { fg = "#282828", bg = "#fabd2f" }
inactive = {}

[input]
border   = { fg = "#fabd2f" }
title    = {}
value    = {}
selected = { reversed = true }

[completion]
border   = { fg = "#504945" }
active   = { bg = "#3c3836" }
inactive = {}

[tasks]
border  = { fg = "#504945" }
title   = {}
hovered = { underline = true }

[which]
mask            = { bg = "#3c3836" }
cand            = { fg = "#83a598" }
rest            = { fg = "#928374" }
desc            = { fg = "#d3869b" }
separator       = "  "
separator_style = { fg = "#504945" }
