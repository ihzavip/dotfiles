[manager]
ratio          = [1, 2, 5]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = false
show_symlink   = true

[preview]
tab_size   = 2
max_width  = 600
max_height = 900

[opener]
extract = [
  { run = 'unar "$1"', desc = "Extract here" },
]
edit = [
  { run = 'nvim "$@"', block = true },
]
open = [
  { run = 'xdg-open "$@"', orphan = true },
]
play = [
  { run = 'mpv "$@"', orphan = true },
]
# ponytail: index counts every dir entry, so a non-image file in the folder shifts the start position
view = [
  { run = 'nsxiv -a -n "$(ls "$(dirname "$1")" | grep -n -x -F "$(basename "$1")" | cut -d: -f1 || echo 1)" -- "$(dirname "$1")"/*', orphan = true, desc = "View all images in dir, start at selected" },
]
view-single = [
  { run = 'nsxiv "$1"', orphan = true, desc = "View image" },
]

[open]
rules = [
  { mime = "text/*",  use = "edit" },
  { url = "*.conf",  use = "edit" },
  { url = "*.lua",   use = "edit" },
  { url = "*.toml",  use = "edit" },
  { url = "*.yml",   use = "edit" },
  { url = "*.yaml",  use = "edit" },
  { url = "*.sh",    use = "edit" },
  { url = "*.c",     use = "edit" },
  { url = "*.h",     use = "edit" },
  { mime = "application/zip",             use = "extract" },
  { mime = "application/x-tar",           use = "extract" },
  { mime = "application/x-bzip2",         use = "extract" },
  { mime = "application/x-7z-compressed", use = "extract" },
  { mime = "application/x-rar",           use = "extract" },
  { mime = "application/gzip",            use = "extract" },
  { mime = "image/*", use = "view" },
  { mime = "video/*", use = "play" },
  { mime = "audio/*", use = "play" },
  { url = "*",        use = "open" },
]
