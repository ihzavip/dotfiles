# Redmi Buds 6 Lite firmware chokes on HFP/HSP: BlueZ brings up the Hands-Free
# gateway, the buds reject it, and the whole ACL link is torn down -- taking
# A2DP with it. Restrict to A2DP so the link stays up.
# Cost: no headset mic on the buds (calls). Delete this file to restore HFP.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
  bluez5.enable-hfp = false
  bluez5.enable-hsp = false
}
