##### PREFIX #####
unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### SHELL #####
set-option -g default-shell /usr/bin/zsh

##### PERFORMANCE #####
set -s escape-time 10
set-option -g focus-events on

##### MOUSE & COPY #####
setw -g mode-keys vi
set -g mouse on
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -sel clip -i"

bind-key < swap-window -t -1
bind-key > swap-window -t +1

# Toggle back and forth between the last two windows
# bind-key Space last-window
# default bind-key a

##### SPLITS & PANE MOVEMENT #####
bind | split-window -h
bind - split-window -v
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### WINDOWS #####
bind c new-window

bind n next-window
bind b previous-window

bind r command-prompt "rename-window %%"
bind N command-prompt "rename-session %%"

##### WINDOWS & PANES START AT 1 #####
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

##### STATUS BAR #####
set -g status-position bottom
set -g status-interval 5

# Gruvbox colors
set -g status-style "bg=#282828,fg=#ebdbb2"

# Left section
set -g status-left "#[fg=#282828,bg=#fabd2f,bold] #S #[fg=#fabd2f,bg=#282828] "
set -g status-left-length 60

# Right section
set -g status-right "#{prefix_highlight}"
set -g status-right-length 40

# prefix highlight
set -g @prefix_highlight_fg '#282828'
set -g @prefix_highlight_bg '#fabd2f'

##### PANE BORDERS #####
set -g pane-border-style fg="#504945"
set -g pane-active-border-style fg="#fabd2f"
set -g window-style bg=#282828
set -g window-active-style bg=#282828

##### WINDOW TABS #####
# Active window
set-window-option -g window-status-current-format "#[fg=#fabd2f,bg=#282828]#[fg=#282828,bg=#fabd2f,bold] #I  #W#{?window_zoomed_flag,#[fg=#cc241d] Z,} #[fg=#fabd2f,bg=#282828]"

# Inactive windows
set-window-option -g window-status-format "#[fg=#928374,bg=#282828] #I  #W "

# Window tabs with activity alert
setw -g window-status-activity-style fg=#fb4934,bg=#282828


##### RELOAD CONFIG #####
bind R source-file ~/.tmux.conf \; display-message "Config reloaded"


##### TPM & SESSION RESTORE #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'  # auto-save every 15 min
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# (Optional) Change auto-save interval (default 15 min)
set -g @continuum-save-interval '10'

# Enable automatic restore on tmux start
set -g @continuum-restore 'on'

# Boot tmux via i3 instead of continuum's systemd service. i3 already launches a
# tmux server at login (exec ... tmux new-session -A -s floating), so the
# continuum-boot service was a redundant SECOND server racing on the same socket
# and failing at boot. @continuum-restore below still restores when i3's server
# starts. Re-enable only if i3 no longer auto-starts tmux.
set -g @continuum-boot 'off'

# Restore running programs in panes (not just layout)
set -g @resurrect-strategy-nvim 'session'

# Restore pane contents (scrollback)
set -g @resurrect-capture-pane-contents 'on'

#set -g @plugin 'catppuccin/tmux'
#set -g @catppuccin_flavour 'mocha'  # mocha ≈ Gruvbox dark

run '~/.tmux/plugins/tpm/tpm'


