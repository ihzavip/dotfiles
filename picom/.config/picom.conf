fading = true;
backend = "glx";
vsync = true;

# Let fullscreen windows bypass the compositor (no extra buffer copy / double
# vsync). Fixes fullscreen stutter in SDL games etc. on the Intel iGPU.
# Unredirection is screen-wide: any fullscreen window -- or a Wine tooltip
# mapping on another workspace -- unredirects everything, and Wine comes back
# with a stale GLX drawable, painted black (MT5). A per-window exclude can't
# stop that, so unredirection stays off entirely. Cost: fullscreen SDL games
# get the extra buffer copy back.
unredir-if-possible = false;
# Inert while the above is false; kept for if it's ever flipped back on.
unredir-if-possible-exclude = [ "class_g = 'terminal64.exe'" ];
